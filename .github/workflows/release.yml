name: Package release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    uses: ./.github/workflows/check.yml
  release:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - name: Check release tag
        shell: Rscript {0}
        run: |
          version = read.dcf("DESCRIPTION")[1, "Version"]
          stopifnot(Sys.getenv("GITHUB_REF_NAME") == paste0("v", version))
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rmarkdown
          needs: build
      - name: Build R package and standalone Shiny bundles
        run: Rscript scripts/build_shiny_release.R
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --verify-tag --title "tkoi $GITHUB_REF_NAME" --notes "Includes the tkoi R source package and standalone Shiny ZIP and tar bundles. Extract a Shiny bundle, run Rscript install.R, and host the extracted app directory. The matching tkoi source package is bundled in vendor/. Launch the installed package app with tkoi::run_tkoi_app()."
          fi
