name: Package release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to package and publish (for example v1.2.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  check:
    uses: ./.github/workflows/check.yml
    with:
      ref: ${{ inputs.tag || github.ref }}
  release:
    needs: check
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - name: Check release tag
        shell: Rscript {0}
        run: |
          version = read.dcf("DESCRIPTION")[1, "Version"]
          stopifnot(Sys.getenv("RELEASE_TAG") == paste0("v", version))
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rmarkdown
          needs: build
      - name: Build R package and standalone Shiny bundles
        run: Rscript scripts/build_shiny_release.R
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* --verify-tag --title "tkoi $RELEASE_TAG" --notes "Includes the tkoi R source package and standalone Shiny ZIP and tar bundles. Extract a Shiny bundle, run Rscript install.R, and host the extracted app directory. The matching tkoi source package is bundled in vendor/. Launch the installed package app with tkoi::run_tkoi_app()."
          fi
